# Check Lua Formatting
name: Check Lua Formatting
on:
  push:
    branches: [master]
  pull_request:

jobs:
  stylua-check:
    name: Stylua Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Stylua Check
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Same version Mason installs locally, so CI and the pre-commit hook agree.
          version: 2.3.1
          args: --check .
